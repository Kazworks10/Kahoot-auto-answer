<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kahoot Auto Answer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon32.png" alt="" width="24" height="24" />
      <h1>Kahoot Auto Answer</h1>
    </header>

    <section id="loaded" hidden>
      <div class="quiz-card">
        <img id="quiz-cover" alt="" />
        <div class="quiz-info">
          <div id="quiz-title"></div>
          <div id="quiz-meta"></div>
        </div>
        <button id="clear" class="icon" type="button" title="Unload quiz" aria-label="Unload quiz">&#x2715;</button>
      </div>
      <details>
        <summary>Show all answers</summary>
        <ol id="answer-list"></ol>
      </details>
    </section>

    <section>
      <form id="id-form">
        <label for="quiz-id">Quiz ID or link</label>
        <div class="row">
          <input id="quiz-id" placeholder="e.g. 272db6c3-a162-4fea-8169-…" autocomplete="off" spellcheck="false" />
          <button type="submit">Load</button>
        </div>
      </form>
      <form id="search-form">
        <label for="search">…or search public quizzes by title</label>
        <div class="row">
          <input id="search" type="search" placeholder="Quiz title" autocomplete="off" />
          <button type="submit">Search</button>
        </div>
      </form>
      <ul id="results"></ul>
      <p id="status" role="status"></p>
    </section>

    <section id="settings">
      <h2>Settings</h2>
      <div class="seg" role="radiogroup" aria-label="Mode">
        <label><input type="radio" name="mode" value="auto" /><span>Auto-answer</span></label>
        <label><input type="radio" name="mode" value="highlight" /><span>Highlight</span></label>
        <label><input type="radio" name="mode" value="off" /><span>Off</span></label>
      </div>
      <div class="row delay">
        <span>Answer delay</span>
        <input id="delay-min" type="number" min="0" max="30" step="0.1" aria-label="Minimum delay in seconds" />
        <span>to</span>
        <input id="delay-max" type="number" min="0" max="30" step="0.1" aria-label="Maximum delay in seconds" />
        <span>sec</span>
      </div>
      <label class="check"><input id="show-overlay" type="checkbox" /> Show answer overlay in game</label>
    </section>

    <footer>Load a quiz, then join the game on <a href="https://kahoot.it" target="_blank" rel="noreferrer">kahoot.it</a>.</footer>

    <script src="popup.js"></script>
  </body>
</html>
